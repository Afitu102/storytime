<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fairytales</title>
</head>
<body>
 
 <header>
  <h1>fairytales</h1>
    <button id="themeToggle" class="theme-btn">
🌙 Dark Mode
    </button>
     <a href="index.html" class="back-btn">
        ← Back Home
    </a>
</header>
<main>

   <div id="continueCard" class="continue-card" style="display:none;">

<h2>▶ Continue Listening</h2>

<p id="continueTitle"></p>

<p id="continueTime"></p>

<button id="continueBtn">
Continue
</button>

</div> 
    
    
 
     
 
       <div class="story-card"
     data-category="Folktales"
     data-page="folktales.html">

    <img
        src="https://cdn.imageurlgenerator.com/uploads/422a2bc8-e3d7-4e38-abb0-7afabf4aa07c.jpg"
        alt="Snow White"
        class="story-card-image">

    <div class="story-card-content">

        <h2>Snow White</h2>

        <p class="story-reading-time">🎧 Audio Story</p>

        <audio class="audio-player">
            <source
                src="https://files.catbox.moe/b6rihq.mp3"
                type="audio/mpeg">
        </audio>

        <div class="controls">
            <button class="play-btn">Play</button>
            <button class="pause-btn">Pause</button>
            <span class="time">0:00</span>
        </div>

    </div>

</div>


</main>
<script src="app.js"></script>
</body>
</html>
